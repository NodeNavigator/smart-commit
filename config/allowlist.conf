# allowlist.conf — explicit exceptions to denylist.conf (same glob format;
# allowlist wins on a match). Keep specific — a broad entry here quietly
# defeats the guardrail for the whole repo. Prefer an exact path over a
# wildcard.

# Template files are meant to be committed — only the real .env is denied.
.env.example
.env.sample
.env.template

# Common, intentionally-committed IDE config for shared editor settings.
# Uncomment if this repo standardizes on committing .vscode/ config:
# .vscode/settings.json
# .vscode/extensions.json

# Test fixtures that are deliberately fake key material for unit tests.
# Prefer naming fixtures clearly (e.g. testdata/fake_rsa_key.pem) and
# allowlisting the exact path rather than a wide pattern:
# testdata/**/*.pem
