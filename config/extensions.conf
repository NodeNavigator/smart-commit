# extensions.conf — classification lists for validate-files.sh and
# validate-generated-files.sh. Format: KEY=comma,separated,values.
# WARN-tier only — archives/binaries are sometimes legitimate; genuinely
# never-commit patterns (secrets, keys) live as hard blocks in denylist.conf.

# Archive/disk-image formats — usually a release artifact, not source.
BINARY_EXTENSIONS=.iso,.dmg,.apk,.zip,.tar,.tar.gz,.tgz,.rar,.7z,.jar,.war,.ear

IDE_FILES=.idea,.vscode,.vs,.sublime-workspace,.sublime-project
OS_FILES=.DS_Store,Thumbs.db,desktop.ini,ehthumbs.db

# Flagged when staged without a matching .proto/spec change (stale codegen).
GENERATED_PROTO_SUFFIXES=.pb.go,.pb.cc,.pb.h,_pb2.py,_pb2_grpc.py,_grpc.pb.go,.pb.rs
GENERATED_SWAGGER_SUFFIXES=.gen.go,.gen.ts,.generated.ts,swagger.gen.json,openapi.gen.json
