# denylist.conf — path patterns scripts/validate-files.sh rejects. One
# glob per line (POSIX `case` match, relative to repo root); `#` comments.
#
# A bare pattern is a HARD BLOCK; prefix `WARN ` for warn-only (a signal
# something risky MIGHT be present, not proof).
#
# `case` globs are anchored — `node_key.json` only matches at the repo
# ROOT, `*/node_key.json` only matches nested. Patterns that could appear
# either place are listed both ways.
#
# One-off exceptions go in allowlist.conf, not here.

# --- Secrets & credentials (filename-shaped; content is validate-secrets.sh's job) ---
*.env
*.env.*
*.pem
*.key
*.p12
*.pfx
*.jks
*.crt
*.cer
*.der
*id_rsa*
*id_dsa*
*id_ecdsa*
*id_ed25519*
*credentials.json
*service-account*.json
.aws/credentials
*/.aws/credentials
.azure/credentials
*/.azure/credentials
.npmrc
*/.npmrc

# --- Build artifacts, dependency trees, generated/cache dirs ---
node_modules/*
*/node_modules/*
dist/*
*/dist/*
build/*
*/build/*
coverage/*
*/coverage/*
tmp/*
*/tmp/*
.cache/*
*/.cache/*
*.tfstate
*.tfstate.backup
.terraform/*
*/.terraform/*

# --- Binaries & executables ---
*.exe
*.dll
*.dylib
*.so
*.bin
*.out
*.obj
*.class
*.pyc
*.pyo

# --- IDE / OS / editor artifacts ---
.DS_Store
*/.DS_Store
Thumbs.db
*/Thumbs.db
.idea/*
*/.idea/*
*.swp
*.swo
*~

# --- Blockchain: validator/wallet key material (always-on, hard block) ---
priv_validator_key.json
*/priv_validator_key.json
priv_validator_state.json
*/priv_validator_state.json
node_key.json
*/node_key.json
*.keystore
UTC--*
*/UTC--*
wallet.dat
*/wallet.dat
*.mnemonic

# --- Blockchain: node-home config (warn — usually public, but a signal
#     a full node-home dir got committed wholesale) ---
WARN genesis.json
WARN */genesis.json
WARN config.toml
WARN */config.toml
WARN app.toml
WARN */app.toml
